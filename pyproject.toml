[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-rag"
version = "0.3.0"
description = "An evaluable Chinese course RAG system with hybrid retrieval and grounded answers"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=5.6,<6",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
